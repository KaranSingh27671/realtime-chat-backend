<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ChatSphere</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   AUTH PAGE
========================= */

#authPage {
    min-height: 100vh;
    background: #090909;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 430px;

    background: #151515;

    border: 1px solid #333;
    border-radius: 22px;

    padding: 42px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.7);
}

.auth-logo {
    width: 64px;
    height: 64px;

    background: white;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 28px;
}

.auth-logo svg {
    width: 32px;
    height: 32px;

    fill: #111;
}

.auth-box h1 {
    color: white;

    font-size: 32px;

    margin-bottom: 10px;
}

.auth-box p {
    color: #999;

    margin-bottom: 30px;
}

.auth-box input {
    width: 100%;

    padding: 15px;

    margin-bottom: 14px;

    border-radius: 10px;

    border: 1px solid #333;

    background: #0a0a0a;

    color: white;

    outline: none;
}

.auth-box input:focus {
    border-color: white;
}

.auth-box button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.auth-box button:hover {
    background: #dddddd;
}

.auth-switch {
    text-align: center;

    color: #999;

    margin-top: 22px;
}

.auth-switch span {
    color: white;

    cursor: pointer;

    font-weight: bold;
}

.error {
    color: #ff7777;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;
}

/* =========================
   CHAT PAGE
========================= */

#chatPage {
    height: 100vh;

    display: flex;

    background: #f4f4f4;

    color: #111;
}

body.dark #chatPage {
    background: #121212;

    color: white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 320px;

    border-right: 1px solid #ddd;

    display: flex;

    flex-direction: column;

    background: white;
}

body.dark .sidebar {
    background: #181818;

    border-color: #333;
}

.sidebar-top {
    padding: 24px;

    border-bottom: 1px solid #ddd;
}

body.dark .sidebar-top {
    border-color: #333;
}

.logo {
    font-size: 24px;

    font-weight: bold;

    margin-bottom: 25px;
}

.profile {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 18px;
}

.avatar {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: black;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;
}

body.dark .avatar {
    background: white;

    color: black;
}

.profile-name {
    font-weight: bold;
}

.profile-email {
    font-size: 13px;

    color: #777;

    margin-top: 4px;
}

.small-button {
    width: 100%;

    padding: 11px;

    border-radius: 8px;

    border: 1px solid #ddd;

    background: transparent;

    cursor: pointer;

    color: inherit;
}

body.dark .small-button {
    border-color: #444;
}

.search-box {
    width: 100%;

    margin-top: 20px;

    padding: 13px;

    border-radius: 8px;

    border: 1px solid #ddd;

    outline: none;
}

body.dark .search-box {
    background: #101010;

    color: white;

    border-color: #444;
}

.users-title {
    padding: 18px 24px 10px;

    font-size: 13px;

    font-weight: bold;

    color: #777;
}

.users-list {
    overflow-y: auto;

    flex: 1;
}

.user {
    padding: 16px 24px;

    display: flex;

    gap: 12px;

    align-items: center;

    cursor: pointer;
}

.user:hover,
.user.active {
    background: #eeeeee;
}

body.dark .user:hover,
body.dark .user.active {
    background: #282828;
}

.user-avatar {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #111;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;
}

body.dark .user-avatar {
    background: white;

    color: black;
}

.user-info {
    overflow: hidden;
}

.user-name {
    font-weight: bold;
}

.user-email {
    color: #777;

    font-size: 13px;

    margin-top: 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================
   MAIN CHAT
========================= */

.main {
    flex: 1;

    display: flex;

    flex-direction: column;
}

.chat-header {
    height: 82px;

    padding: 0 28px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom: 1px solid #ddd;

    background: white;
}

body.dark .chat-header {
    background: #181818;

    border-color: #333;
}

.chat-user {
    display: flex;

    align-items: center;

    gap: 12px;
}

.chat-user h2 {
    font-size: 18px;
}

.chat-user p {
    color: #777;

    margin-top: 4px;

    font-size: 13px;
}

.theme-button {
    padding: 11px 16px;

    border-radius: 8px;

    border: 1px solid #ddd;

    background: transparent;

    color: inherit;

    cursor: pointer;
}

body.dark .theme-button {
    border-color: #444;
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 30px;

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.empty-chat {
    margin: auto;

    color: #777;

    font-size: 18px;
}

.message {
    max-width: 70%;

    padding: 12px 15px;

    border-radius: 14px;

    line-height: 1.4;

    word-break: break-word;
}

.message.sent {
    align-self: flex-end;

    background: #111;

    color: white;

    border-bottom-right-radius: 3px;
}

body.dark .message.sent {
    background: white;

    color: black;
}

.message.received {
    align-self: flex-start;

    background: #e5e5e5;

    color: black;

    border-bottom-left-radius: 3px;
}

body.dark .message.received {
    background: #292929;

    color: white;
}

.message-time {
    font-size: 10px;

    opacity: 0.6;

    margin-top: 5px;
}

/* =========================
   MESSAGE FORM
========================= */

.message-form {
    padding: 18px 28px;

    display: flex;

    gap: 12px;

    border-top: 1px solid #ddd;

    background: white;
}

body.dark .message-form {
    background: #181818;

    border-color: #333;
}

.message-input {
    flex: 1;

    padding: 15px;

    border-radius: 10px;

    border: 1px solid #ddd;

    outline: none;
}

body.dark .message-input {
    background: #101010;

    color: white;

    border-color: #444;
}

.send-button {
    padding: 0 25px;

    border: none;

    border-radius: 10px;

    background: #111;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

body.dark .send-button {
    background: white;

    color: black;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 280px;
    }

    .chat-header {
        padding: 0 15px;
    }

    .messages {
        padding: 18px;
    }

    .message-form {
        padding: 14px;
    }

    .message {
        max-width: 85%;
    }

    .theme-button {
        padding: 8px 10px;

        font-size: 12px;
    }
}

</style>

</head>

<body>

<!-- =========================
     AUTH PAGE
========================= -->

<div id="authPage">

    <div class="auth-box">

        <div class="auth-logo">

            <svg viewBox="0 0 24 24">

                <path
                    d="M20 2H4a2 2 0 0 0-2 2v16l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-4 9H8V9h8v2z"
                />

            </svg>

        </div>

        <h1 id="authTitle">
            Welcome back
        </h1>

        <p id="authText">
            Login to continue chatting
        </p>

        <input
            id="username"
            class="hidden"
            type="text"
            placeholder="Username"
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="authButton">
            Login
        </button>

        <div class="auth-switch">

            <span id="switchText">
                Create an account
            </span>

        </div>

        <div
            id="authError"
            class="error"
        ></div>

    </div>

</div>


<!-- =========================
     CHAT PAGE
========================= -->

<div
    id="chatPage"
    class="hidden"
>

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                ChatSphere
            </div>

            <div class="profile">

                <div
                    id="myAvatar"
                    class="avatar"
                >
                    ?
                </div>

                <div>

                    <div
                        id="myUsername"
                        class="profile-name"
                    >
                        User
                    </div>

                    <div
                        id="myEmail"
                        class="profile-email"
                    ></div>

                </div>

            </div>

            <button
                id="logoutButton"
                class="small-button"
            >
                Logout
            </button>

            <input
                id="userSearch"
                class="search-box"
                placeholder="Search users..."
            >

        </div>

        <div class="users-title">
            USERS
        </div>

        <div
            id="usersList"
            class="users-list"
        ></div>

    </aside>


    <main class="main">

        <div class="chat-header">

            <div class="chat-user">

                <div
                    id="chatAvatar"
                    class="avatar"
                >
                    ?
                </div>

                <div>

                    <h2 id="chatName">
                        Select a user
                    </h2>

                    <p id="chatStatus">
                        Choose someone to chat
                    </p>

                </div>

            </div>

            <button
                id="themeButton"
                class="theme-button"
            >
                🌙 Dark Mode
            </button>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">
                Select a user to start chatting
            </div>

        </div>


        <form
            id="messageForm"
            class="message-form"
        >

            <input
                id="messageInput"
                class="message-input"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                class="send-button"
                type="submit"
            >
                Send
            </button>

        </form>

    </main>

</div>


<!-- =========================
     SOCKET.IO
========================= -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/* =========================
   PRODUCTION URLS
========================= */

const API_URL =
    "https://realtime-chat-backend-1-relt.onrender.com/api";

const SOCKET_URL =
    "https://realtime-chat-backend-1-relt.onrender.com";


/* =========================
   VARIABLES
========================= */

let isRegisterMode = false;

let currentUser = null;

let selectedUser = null;

let socket = null;


/* =========================
   DOM
========================= */

const authPage =
    document.getElementById("authPage");

const chatPage =
    document.getElementById("chatPage");

const authTitle =
    document.getElementById("authTitle");

const authText =
    document.getElementById("authText");

const usernameInput =
    document.getElementById("username");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const authButton =
    document.getElementById("authButton");

const switchText =
    document.getElementById("switchText");

const authError =
    document.getElementById("authError");

const usersList =
    document.getElementById("usersList");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");


/* =========================
   LOGIN / REGISTER SWITCH
========================= */

switchText.addEventListener(
    "click",
    () => {

        isRegisterMode =
            !isRegisterMode;

        authError.textContent = "";

        if (isRegisterMode) {

            authTitle.textContent =
                "Create account";

            authText.textContent =
                "Join and start chatting";

            usernameInput
                .classList
                .remove("hidden");

            authButton.textContent =
                "Create Account";

            switchText.textContent =
                "Already have an account? Login";

        } else {

            authTitle.textContent =
                "Welcome back";

            authText.textContent =
                "Login to continue chatting";

            usernameInput
                .classList
                .add("hidden");

            authButton.textContent =
                "Login";

            switchText.textContent =
                "Create an account";
        }

    }
);


/* =========================
   LOGIN / REGISTER
========================= */

authButton.addEventListener(
    "click",
    async () => {

        authError.textContent = "";

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        try {

            let url;

            let body;


            if (isRegisterMode) {

                url =
                    API_URL +
                    "/auth/register";

                body = {

                    username:
                        usernameInput
                            .value
                            .trim(),

                    email,

                    password
                };

            } else {

                url =
                    API_URL +
                    "/auth/login";

                body = {

                    email,

                    password
                };
            }


            const response =
                await fetch(
                    url,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(body)
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Authentication failed"
                );
            }


            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            currentUser =
                data.user;


            showChat();

        } catch (error) {

            authError.textContent =
                error.message;

        }

    }
);


/* =========================
   SHOW CHAT
========================= */

async function showChat() {

    authPage
        .classList
        .add("hidden");

    chatPage
        .classList
        .remove("hidden");


    document.getElementById(
        "myUsername"
    ).textContent =
        currentUser.username;


    document.getElementById(
        "myEmail"
    ).textContent =
        currentUser.email;


    document.getElementById(
        "myAvatar"
    ).textContent =
        currentUser.username
            .charAt(0)
            .toUpperCase();


    connectSocket();

    loadUsers();

}


/* =========================
   SOCKET CONNECTION
========================= */

function connectSocket() {

    if (socket) {

        socket.disconnect();
    }


    socket =
        io(
            SOCKET_URL,
            {

                auth: {

                    token:
                        localStorage
                            .getItem(
                                "token"
                            )
                }

            }
        );


    /* CONNECTED */

    socket.on(
        "connect",
        () => {

            console.log(
                "Socket connected:",
                socket.id
            );


            /*
                Join user's personal room.

                Backend uses this room
                to send receiveMessage.
            */

            socket.emit(
                "join",
                currentUser._id
            );

        }
    );


    /* CONNECTION ERROR */

    socket.on(
        "connect_error",
        error => {

            console.log(
                "Socket connection error:",
                error.message
            );

        }
    );


    /* =========================
       MESSAGE SENT
    ========================= */

    socket.on(
        "messageSent",
        message => {

            console.log(
                "Message sent:",
                message
            );


            /*
                Backend sends this
                only to the sender.

                Add it immediately
                to our chat.
            */

            if (!selectedUser) {
                return;
            }


            const senderId =
                typeof message.sender === "object"
                    ? message.sender._id
                    : message.sender;

            const receiverId =
                typeof message.receiver === "object"
                    ? message.receiver._id
                    : message.receiver;


            if (
                String(senderId) ===
                    String(currentUser._id)
                &&
                String(receiverId) ===
                    String(selectedUser._id)
            ) {

                addMessage(message);

                messages.scrollTop =
                    messages.scrollHeight;
            }

        }
    );


    /* =========================
       RECEIVE MESSAGE
    ========================= */

    socket.on(
        "receiveMessage",
        message => {

            console.log(
                "Received message:",
                message
            );


            if (!selectedUser) {

                return;
            }


            const senderId =
                typeof message.sender === "object"
                    ? message.sender._id
                    : message.sender;


            const receiverId =
                typeof message.receiver === "object"
                    ? message.receiver._id
                    : message.receiver;


            /*
                If this message belongs
                to the currently open chat,
                display it immediately.
            */

            if (

                String(senderId) ===
                    String(selectedUser._id)

                ||

                String(receiverId) ===
                    String(selectedUser._id)

            ) {

                addMessage(message);

                messages.scrollTop =
                    messages.scrollHeight;
            }

        }
    );

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    try {

        const token =
            localStorage.getItem(
                "token"
            );


        const response =
            await fetch(

                API_URL +
                "/auth/users",

                {

                    headers: {

                        Authorization:
                            "Bearer " +
                            token
                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Failed to load users"
            );
        }


        const users =
            await response.json();


        usersList.innerHTML = "";


        users.forEach(
            user => {

                const userElement =
                    document.createElement(
                        "div"
                    );


                userElement.className =
                    "user";


                userElement.dataset.userId =
                    user._id;


                const avatar =
                    document.createElement(
                        "div"
                    );


                avatar.className =
                    "user-avatar";


                avatar.textContent =
                    user.username
                        .charAt(0)
                        .toUpperCase();


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "user-info";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "user-name";


                name.textContent =
                    user.username;


                const email =
                    document.createElement(
                        "div"
                    );


                email.className =
                    "user-email";


                email.textContent =
                    user.email || "";


                info.appendChild(
                    name
                );

                info.appendChild(
                    email
                );


                userElement.appendChild(
                    avatar
                );

                userElement.appendChild(
                    info
                );


                userElement.addEventListener(
                    "click",
                    () => {

                        selectUser(user);

                    }
                );


                usersList.appendChild(
                    userElement
                );

            }
        );


    } catch (error) {

        console.log(
            "Load users error:",
            error
        );

    }

}


/* =========================
   SELECT USER
========================= */

function selectUser(user) {

    selectedUser =
        user;


    document
        .querySelectorAll(".user")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    const activeUser =
        document.querySelector(
            `[data-user-id="${user._id}"]`
        );


    if (activeUser) {

        activeUser.classList.add(
            "active"
        );
    }


    document.getElementById(
        "chatName"
    ).textContent =
        user.username;


    document.getElementById(
        "chatStatus"
    ).textContent =
        user.email || "";


    document.getElementById(
        "chatAvatar"
    ).textContent =
        user.username
            .charAt(0)
            .toUpperCase();


    loadMessages();

}


/* =========================
   LOAD OLD MESSAGES
========================= */

async function loadMessages() {

    if (!selectedUser) {
        return;
    }


    try {

        const token =
            localStorage.getItem(
                "token"
            );


        const response =
            await fetch(

                API_URL +
                "/messages?userId=" +
                encodeURIComponent(
                    selectedUser._id
                ),

                {

                    headers: {

                        Authorization:
                            "Bearer " +
                            token
                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Failed to load messages"
            );
        }


        const data =
            await response.json();


        messages.innerHTML = "";


        data.forEach(
            message => {

                addMessage(
                    message
                );

            }
        );


        messages.scrollTop =
            messages.scrollHeight;


    } catch (error) {

        console.log(
            "Load messages error:",
            error
        );

    }

}


/* =========================
   ADD MESSAGE TO UI
========================= */

function addMessage(message) {

    /*
        Prevent duplicate rendering
        if the same message somehow
        arrives twice.
    */

    if (
        message._id &&
        document.querySelector(
            `[data-message-id="${message._id}"]`
        )
    ) {

        return;
    }


    const senderId =
        typeof message.sender === "object"
            ? message.sender._id
            : message.sender;


    const messageElement =
        document.createElement(
            "div"
        );


    if (message._id) {

        messageElement.dataset.messageId =
            message._id;
    }


    const isMine =
        String(senderId) ===
        String(currentUser._id);


    messageElement.className =
        "message " +
        (
            isMine
                ? "sent"
                : "received"
        );


    const content =
        document.createElement(
            "div"
        );


    content.textContent =
        message.content;


    const timeElement =
        document.createElement(
            "div"
        );


    timeElement.className =
        "message-time";


    const time =
        message.createdAt

            ? new Date(
                message.createdAt
            ).toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )

            : "";


    timeElement.textContent =
        time;


    messageElement.appendChild(
        content
    );


    messageElement.appendChild(
        timeElement
    );


    messages.appendChild(
        messageElement
    );

}


/* =========================
   SEND MESSAGE
========================= */

document.getElementById(
    "messageForm"
).addEventListener(
    "submit",
    event => {

        event.preventDefault();


        if (!selectedUser) {

            return;
        }


        if (
            !socket ||
            !socket.connected
        ) {

            alert(
                "Not connected to server"
            );

            return;
        }


        const content =
            messageInput.value.trim();


        if (!content) {

            return;
        }


        /*
            IMPORTANT:

            We DO NOT use:

            fetch(API_URL + "/messages")

            here.

            Socket.IO sends the message
            to the backend.

            Backend:
                1. saves message
                2. sends messageSent
                   to sender
                3. sends receiveMessage
                   to receiver
        */

        socket.emit(
            "sendMessage",
            {

                receiver:
                    String(
                        selectedUser._id
                    ),

                content:
                    content

            }
        );


        messageInput.value = "";

    }
);


/* =========================
   LOGOUT
========================= */

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "token"
        );


        localStorage.removeItem(
            "user"
        );


        if (socket) {

            socket.disconnect();
        }


        currentUser =
            null;

        selectedUser =
            null;


        location.reload();

    }
);


/* =========================
   DARK MODE
========================= */

document.getElementById(
    "themeButton"
).addEventListener(
    "click",
    () => {

        document.body
            .classList
            .toggle("dark");


        const button =
            document.getElementById(
                "themeButton"
            );


        if (
            document.body
                .classList
                .contains("dark")
        ) {

            button.textContent =
                "☀ Light Mode";

        } else {

            button.textContent =
                "🌙 Dark Mode";
        }

    }
);


/* =========================
   USER SEARCH
========================= */

document.getElementById(
    "userSearch"
).addEventListener(
    "input",
    event => {

        const search =
            event.target.value
                .toLowerCase();


        document
            .querySelectorAll(".user")
            .forEach(
                user => {

                    user.style.display =

                        user.innerText
                            .toLowerCase()
                            .includes(search)

                            ? "flex"

                            : "none";

                }
            );

    }
);


/* =========================
   AUTO LOGIN
========================= */

window.addEventListener(
    "load",
    () => {

        const token =
            localStorage.getItem(
                "token"
            );


        const savedUser =
            localStorage.getItem(
                "user"
            );


        if (
            token &&
            savedUser
        ) {

            try {

                currentUser =
                    JSON.parse(
                        savedUser
                    );


                showChat();

            } catch (error) {

                localStorage.removeItem(
                    "token"
                );

                localStorage.removeItem(
                    "user"
                );

            }

        }

    }
);

</script>

</body>
